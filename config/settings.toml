[youtube]
api_base = "https://www.googleapis.com/youtube/v3"
region_code = "KR"

[trending]
runs_per_day = 3
categories = [10, 17, 20, 22, 23, 24, 25, 26]
max_pages_per_category = 1
# videos in these categories are still collected (for trending_rank/videos data), but their
# channel is auto-excluded from channel_pool instead of auto-included — 25 = News & Politics
exclude_channel_categories = ["25"]

[shorts]
max_duration_sec = 180

[quota]
daily_cap = 10000
unit_cost_videos_list = 1
unit_cost_playlist_items_list = 1
unit_cost_channels_list = 1
trending_reserved = 200
channel_incremental_reserved = 3000

[channels.backfill]
max_videos_per_channel = 500
batch_size = 50
# spread ~500 channels/day of backfill across several runs instead of one giant batch
daily_channel_target = 500
runs_per_day = 4

[channels.incremental]
growth_window_days = 7
new_video_max_pages = 5
safe_buffer_days = 2

[discovery]
# one-off bootstrap (src/discover_channels.py): search.list order=viewCount per keyword,
# genre-focused so it skews toward creator channels rather than broadcasters/news
keywords = [
    "브이로그", "먹방", "챌린지", "게임", "뷰티", "헬스", "운동", "여행", "요리", "패션",
    "댄스", "커버", "음악", "코미디", "개그", "일상", "리뷰", "언박싱", "키즈", "반려동물",
    "인테리어", "재테크", "주식", "ASMR", "스포츠", "애니메이션", "자동차", "IT", "테크", "연애",
]
max_results_per_keyword = 50
exclude_category_ids = ["25"]
unit_cost_search_list = 100

[storage]
# database is Postgres (Supabase), configured via the DATABASE_URL env var — see .env.example
raw_dir = "data/raw"
