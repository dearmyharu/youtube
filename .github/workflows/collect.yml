name: collect

on:
  # PAUSED 2026-08-10 (user request). Schedule triggers commented out rather than
  # deleted so re-enabling is a one-line revert; workflow_dispatch (manual runs)
  # still works. See docs/system-guide.md for context on this project's pause history.
  # schedule:
  #   # KST 09:00 / 15:00 / 21:00 = UTC 00:00 / 06:00 / 12:00 (docs/trending-collector-spec.md #2)
  #   - cron: "0 0,6,12 * * *"
  #   # backfill runs 4x/day (settings.toml channels.backfill.runs_per_day), offset from trending
  #   # so ~500 channels/day of history gets spread across the day instead of one giant batch
  #   - cron: "0 2,8,14,20 * * *"
  #   # incremental (new-video detection + 7-day growth window) once daily
  #   - cron: "30 21 * * *"
  #   # dashboard aggregates: well after incremental's worst-case 4h window (21:30 + 4h = 01:30)
  #   # so it reflects that day's freshest data
  #   - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      channel_mode:
        description: "collect_channels mode (manual dispatch only)"
        type: choice
        options: [backfill, incremental, both]
        default: both

jobs:
  trending:
    if: github.event.schedule == '0 0,6,12 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: collect-trending
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.collect_trending
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # DB writes go straight to Supabase Postgres; only the raw API archive is runner-local,
      # so it's uploaded here (source-of-truth retention, docs/trending-collector-spec.md #0.1).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trending-raw-${{ github.run_id }}
          path: data/raw/trending
          retention-days: 90
          if-no-files-found: ignore

  channel-backfill:
    if: github.event.schedule == '0 2,8,14,20 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.channel_mode != 'incremental')
    runs-on: ubuntu-latest
    # generous margin over the ~40min a 125-channel batch normally takes — without this,
    # a hung run blocks the shared concurrency group (and everything queued behind it) for
    # up to GitHub's default 6h job cap instead of failing fast (see docs/system-guide.md)
    timeout-minutes: 90
    # same concurrency group as incremental: they both touch channel_collection_state and
    # share the day's quota budget (db.get_quota_used_today), so they must never overlap
    concurrency:
      group: collect-channels
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.collect_channels --mode backfill
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: channel-backfill-raw-${{ github.run_id }}
          path: data/raw/channel
          retention-days: 90
          if-no-files-found: ignore

  channel-incremental:
    if: github.event.schedule == '30 21 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.channel_mode != 'backfill')
    runs-on: ubuntu-latest
    # incremental touches every included channel (1 non-batchable API call each), so this
    # legitimately grows with the channel count — already ~3h at ~1400 channels. Revisit this
    # ceiling (or split the job) if it keeps climbing; see docs/system-guide.md.
    timeout-minutes: 240
    concurrency:
      group: collect-channels
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.collect_channels --mode incremental
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: channel-incremental-raw-${{ github.run_id }}
          path: data/raw/channel
          retention-days: 90
          if-no-files-found: ignore

  build-dashboard-aggregates:
    if: github.event.schedule == '30 3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # read-only against videos/channel_pool, writes only the two aggregate tables —
    # doesn't touch channel_collection_state or the quota budget, so it doesn't need
    # to share the collect-channels concurrency group, only guard against itself
    timeout-minutes: 60
    concurrency:
      group: build-dashboard-aggregates
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.build_dashboard_aggregates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
