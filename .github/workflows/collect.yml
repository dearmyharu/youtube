name: collect

on:
  schedule:
    # KST 09:00 / 15:00 / 21:00 = UTC 00:00 / 06:00 / 12:00 (docs/trending-collector-spec.md #2)
    - cron: "0 0,6,12 * * *"
    # once daily, offset from the trending runs (docs/collect-channels-spec.md #3, #4)
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      channel_mode:
        description: "collect_channels mode (manual dispatch only)"
        type: choice
        options: [backfill, incremental, both]
        default: both

jobs:
  trending:
    if: github.event.schedule == '0 0,6,12 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: collect-trending
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.collect_trending
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # DB writes go straight to Supabase Postgres; only the raw API archive is runner-local,
      # so it's uploaded here (source-of-truth retention, docs/trending-collector-spec.md #0.1).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trending-raw-${{ github.run_id }}
          path: data/raw/trending
          retention-days: 90
          if-no-files-found: ignore

  channels:
    if: github.event.schedule == '30 3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: collect-channels
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - if: github.event_name != 'workflow_dispatch' || github.event.inputs.channel_mode != 'incremental'
        run: python -m src.collect_channels --mode backfill
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - if: github.event_name != 'workflow_dispatch' || github.event.inputs.channel_mode != 'backfill'
        run: python -m src.collect_channels --mode incremental
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: channel-raw-${{ github.run_id }}
          path: data/raw/channel
          retention-days: 90
          if-no-files-found: ignore
